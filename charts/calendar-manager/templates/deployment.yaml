apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "calendar-manager.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "calendar-manager.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "calendar-manager.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "calendar-manager.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CONFIG_PATH
              value: /config/config.yaml
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /probe
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /probe
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            {{- if or .Values.googleCredentials .Values.existingCredentialsSecret }}
            - name: credentials
              mountPath: /secrets
              readOnly: true
            {{- end }}
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: {{ include "calendar-manager.fullname" . }}-config
        {{- if or .Values.googleCredentials .Values.existingCredentialsSecret }}
        - name: credentials
          secret:
            secretName: {{ if .Values.existingCredentialsSecret }}{{ .Values.existingCredentialsSecret }}{{ else }}{{ include "calendar-manager.fullname" . }}-credentials{{ end }}
        {{- end }}
